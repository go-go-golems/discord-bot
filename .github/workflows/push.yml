name: golang-pipeline

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check generated loggers
        run: make logcopter-check
      - name: Build, test and vet both bot runtimes
        run: make build test vet
      - name: Smoke test Slack CLI discovery
        run: go run ./cmd/slack-bot bots list
