pre-commit:
  commands:
    lint:
      glob: '*.{go,mod,sum,yml,yaml}'
      run: make lint logcopter-check
    test:
      glob: '*.{go,js,mod,sum}'
      run: make test
  parallel: true

# Release generation/tidy mutates the checkout and belongs to an explicit release,
# not a concurrent push hook. Keep the same blocking checks as CI here.
pre-push:
  commands:
    checks:
      run: make check
